# MoM reference settings (upstream pretrain.sh / train.py; paper Sec. 4):
# AdamW(0.9, 0.95, eps 1e-5), weight decay 0.1 (HF: no decay on bias/LayerNorm), cosine schedule,
# warmup ratio 0.1 (paper), clip 1.0, lr 1e-3, no dropout (train.py no_dropout=True).
fidelity: "L2 reference units, causal LM interface (loss on the relation token only)"
data: {regime: length, train_limit: null, valid_limit: null}
optim:
  type: adamw
  lr: 1.0e-3
  betas: [0.9, 0.95]
  eps: 1.0e-5
  weight_decay: 0.1
  hf_no_decay: true
  schedule: cosine
  warmup_ratio: 0.1
  clip_norm: 1.0
loss: {label_smoothing: 0.0}
train: {max_steps: 20000, batch_size: 128, eval_every: 500, eval_batch_size: 512, log_every: 50, patience: null, seed: 0}
