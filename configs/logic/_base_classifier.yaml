# Shared settings for the controlled common-backbone panel (plan sec. 6, 10, 11).
# Width 128, six block applications, <cls> readout, identical data/optimiser/selection for every family.
fidelity: "L3 controlled variant (common encoder-classifier interface)"
data: {regime: length, train_limit: null, valid_limit: null}
optim:
  type: adamw
  lr: 1.0e-3            # screen {3e-4, 1e-3} on validation only
  betas: [0.9, 0.98]
  eps: 1.0e-8
  weight_decay: 0.01
  schedule: cosine
  warmup_steps: 1000
  clip_norm: 1.0
loss: {label_smoothing: 0.0, aux_reduction: fairseq}
train: {max_steps: 20000, batch_size: 128, eval_every: 500, eval_batch_size: 512, log_every: 50, patience: null, seed: 0}
